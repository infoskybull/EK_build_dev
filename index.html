<script>
  var canvas1 = document.querySelector("#unity-canvas");

  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/EK.loader.js";
  var config = {
    arguments: [],
    dataUrl: buildUrl + "/EK.data.unityweb",
    frameworkUrl: buildUrl + "/EK.framework.js.unityweb",
    codeUrl: buildUrl + "/EK.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Skybull",
    productName: "EK",
    productVersion: "0.1.0",
  };


  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    // Mobile device style: fill the whole browser client area with the game canvas:

    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
    document.querySelector("#unity-container").className = "unity-mobile";
    canvas1.className = "unity-mobile";

  }

  document.querySelector("#unity-loading-bar").style.display = "block";

  const loadingContainer = document.getElementById("unity-loading-background");
  const progressFull = document.getElementById("unity-progress-bar-full");
  const progressEmpty = document.getElementById("unity-progress-bar-empty");
  window.DisableLoading = function() {
    loadingContainer.style.display = "none";
  }


  var script = document.createElement("script");
  var unityInstanceGlobal;
  script.src = loaderUrl;
  script.onload = () => {
    createUnityInstance(canvas1, config, (progress) => {
      progressFull.style.transform = `scaleX(${progress})`;
    }).then((unityInstance) => {
      unityInstanceGlobal = unityInstance;
    }).catch((message) => {
      alert(message);
    });
  };

  document.body.appendChild(script);

  function sendLog(log) {
    unityInstanceGlobal.SendMessage('Web3Manager', 'OnSendLog', log);
  }


</script>

<script>
  function detectKeyboard({
                            threshold,
                            target,
                            onChange = () => {},
                          } = {}) {
    window.keyboardIsOpen = false;
    let baselineH = null;      // chiều cao viewport “bình thường”
    let isOpen = false;
    let rafId = null;

    const getHeights = () => {
      const vv = window.visualViewport;
      return {
        innerH: window.innerHeight,
        visualH: vv ? Math.round(vv.height) : null
      };
    };

    // Xác lập baseline khi DOM ổn định (sau 1 frame)
    const setBaselineSoon = () => {
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(() => {
        const { innerH, visualH } = getHeights();
        baselineH = visualH ?? innerH;
      });
    };

    const getDelta = () => {
      const { innerH, visualH } = getHeights();
      const current = visualH ?? innerH;
      if (baselineH == null) baselineH = current;
      return baselineH - current; // dương khi bị co hẹp
    };

    const effectiveThreshold = () => {
      if (typeof threshold === "number") return threshold;
      // Tự động: 18% chiều cao baseline, tối thiểu 100px, tối đa 320px
      const base = baselineH || (getHeights().visualH ?? getHeights().innerH);
      return Math.max(100, Math.min(320, Math.round(base * 0.18)));
    };

    const updateState = (reason) => {
      const delta = getDelta();
      const th = effectiveThreshold();
      const nextOpen = delta > th;
      // Cập nhật biến global
      window.keyboardIsOpen = nextOpen;
      if (nextOpen !== isOpen) {
        isOpen = nextOpen;
        onChange(isOpen, { reason, delta, threshold: th });
      }
    };

    // Debounce nhẹ cho resize/scroll (iOS có thể bắn liên tục)
    let t;
    const debounceUpdate = (reason) => {
      clearTimeout(t);
      t = setTimeout(() => updateState(reason), 50);
    };

    // Listeners
    const listeners = [];

    const add = (el, ev, fn, opts) => {
      el.addEventListener(ev, fn, opts);
      listeners.push(() => el.removeEventListener(ev, fn, opts));
    };

    // Thiết lập baseline sau lần chạm đầu tiên / DOM ready
    add(document, "visibilitychange", setBaselineSoon);
    add(window, "orientationchange", () => {
      // Orientation mới -> đặt baseline lại sau khi layout ổn
      baselineH = null;
      setBaselineSoon();
      debounceUpdate("orientationchange");
    });

    // Resize: Android dùng innerHeight, iOS dùng VisualViewport tốt hơn
    if (window.visualViewport) {
      add(window.visualViewport, "resize", () => debounceUpdate("vv:resize"));
      add(window.visualViewport, "scroll", () => debounceUpdate("vv:scroll"));
    }
    add(window, "resize", () => debounceUpdate("win:resize"));

    // Focus/blur trên input giúp tăng độ chắc chắn
    if (target) {
      add(target, "focus", () => {
        setBaselineSoon();
        // chờ 1 nhịp để viewport co lại
        setTimeout(() => updateState("focus"), 120);
      });
      add(target, "blur", () => {
        // iOS đôi khi delay đóng; cho 1 chút thời gian
        setTimeout(() => {
          baselineH = null; // khi đóng, lấy lại baseline mới
          updateState("blur");
        }, 120);
      });
    } else {
      // Nếu không truyền target, vẫn nghe capture trên document
      add(document, "focusin", (e) => {
        if (e.target && /^(input|textarea)$/i.test(e.target.tagName)) {
          setBaselineSoon();
          setTimeout(() => updateState("focusin"), 120);
        }
      }, true);
      add(document, "focusout", () => {
        setTimeout(() => {
          baselineH = null;
          updateState("focusout");
        }, 120);
      }, true);
    }

    // Khởi tạo baseline ban đầu
    setBaselineSoon();

    return {
      destroy() {
        cancelAnimationFrame(rafId);
        clearTimeout(t);
        listeners.forEach((off) => off());
      }
    };
  }

  // --- Khởi tạo cho input #myInput (nếu tồn tại) ---
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("myInput");
    const target = input || undefined;
    // Tạo detector
    const detector = detectKeyboard({
      target,
      onChange(isOpen, detail) {
        console.log("Keyboard:", isOpen ? "OPEN" : "CLOSED", detail);
        
        if(isOpen){
          sendLog("keyboard is open");
        }
        else {
          sendLog("keyboard is close")
        }
        document.body.classList.toggle("kb-open", isOpen);
        // Nếu muốn báo về Unity có thể gọi:
        // if (typeof sendLog === "function") sendLog("keyboard:" + (isOpen ? "open" : "closed"));
      }
      // threshold: 140, // có thể điều chỉnh nếu cần
    });

    // Nếu cần hủy:
    // window.__kbDetector = detector;
  });

</script>
