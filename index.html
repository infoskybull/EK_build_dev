<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | EK</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
  <script src="https://unpkg.com/@tonconnect/ui@2.1.0/dist/tonconnect-ui.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }

    #unity-container {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 360px;
      height: 640px;
      transform: translate(-50%, -50%);
      background: #000;
      z-index: 1;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: url('Loading.png') no-repeat center;
      background-size: cover;
      z-index: 999;

    }
    #unity-loading-background{
      width: 100%;
      height: 100%;
      background: url('Loading.png') no-repeat center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: absolute;
      top: 0;
      left: 0;
    }

    #unity-loading-bar {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: absolute;
      bottom: 0px;
      left: 0%;
      width: 100%;                    /* bỏ kéo full-width viewport */
      height: 120px;
      pointer-events: none;
      z-index: 1;
      background: transparent;
      top: revert-layer;
    }

    #unity-progress-bar-empty {
      width: 240px;
      height: 30px;
      margin: 10px auto 0 auto;
      background: url('loading_empty.png') no-repeat center;
      background-size: cover;
      overflow: hidden;
      position: relative;
    }



    #unity-progress-bar-mask {
      height: 100%;
      width: 0%;            /* bắt đầu từ 0% */
      overflow: hidden;
      position: absolute;   /* QUAN TRỌNG: đặt chồng lên */
      left: 0;
      top: 0;
    }

    #unity-progress-bar-full {
      position: absolute;
      left: 0;
      bottom: 0;
      align-items: center;
      width: 100%; /* sẽ bị scale theo chiều ngang */
      height: 30px;
      background: url('loading_full.png') no-repeat left center;
      background-size: cover;
      transform: scaleX(1); /* bắt đầu từ 0 */
      transform-origin: left;
      transition: transform 0.2s ease-out;
    }

    #unity-loading-text {
      margin-top: 8px;
      text-align: center;
      font-family: 'Baloo2ExtraBold', sans-serif;
      font-size: 16px;
      color: #ffffff;
      line-height: 1.1;
      white-space: pre-line;
      text-shadow:
              -1px -1px 0 #000,
              1px -1px 0 #000,
              -1px  1px 0 #000,
              1px  1px 0 #000;
    }

    @font-face {
      font-family: 'Baloo2ExtraBold';
      src: url('font_Baloo2_ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
    }

    /* Popup warning overlay */
    #warning-popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999999; /* đảm bảo luôn trên canvas */
    }

    #warning-popup .warning-popup-content {
      max-width: 320px;
      margin: 0 16px;
      background: #111;
      color: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      text-align: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    #warning-text {
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-line;   /* cho phép xuống dòng theo \n */
    }

    #warning-confirm {
      border: none;
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }

  </style>

  <style>
    body{
      margin:0;
      overflow:hidden;
      background:#000;
    }
    #unity-container{
      position:fixed;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      background:#000;
      z-index: 0;
    }

    /* Biến CSS lấy tai thỏ iOS */
    :root{
      --sa-top:   env(safe-area-inset-top);
      --sa-right: env(safe-area-inset-right);
      --sa-bottom:env(safe-area-inset-bottom);
      --sa-left:  env(safe-area-inset-left);
    }
  </style>


</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas"></canvas>

  <div id="unity-loading-background">
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-mask">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-loading-text"></div>

    </div>
  </div>

  <div id="warning-popup">
    <div class="warning-popup-content">
      <div id="warning-text"></div>
      <button id="warning-confirm">OK</button>
    </div>
  </div>


  <script>
    const canvas   = document.getElementById('unity-container');
    const ASPECT   = 9/16;      // 16:9 (width/height)

    function resizeCanvas(){
      //const {top,right,bottom,left} = safeInsets();
      const safeW = window.innerWidth ;
      const safeH = window.innerHeight ;

      // if(isMobile){
      //   /* 📱 MOBILE: chiếm toàn bộ vùng an toàn, tỉ lệ tùy máy */
      //   canvas.style.width  = `${safeW}px`;
      //   canvas.style.height = `${safeH}px`;
      // }else{
      /* 💻 DESKTOP: ép tỉ lệ 16:9, căn giữa */
      const currentAspect = safeW / safeH;
      let w,h;
      if(currentAspect > ASPECT){      // cửa sổ quá rộng
        h = safeH;
        w = h * ASPECT;
      }else{                           // cửa sổ quá cao
        w = safeW;
        h = w / ASPECT;
      }
      canvas.style.width  = `${w}px`;
      canvas.style.height = `${h}px`;
      //}
    }

    /* Gọi khi tải & khi đổi kích thước */
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', resizeCanvas);
    }
  </script>


  <script>
    var canvas1 = document.querySelector("#unity-canvas");

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/EK.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/EK.data.unityweb",
      frameworkUrl: buildUrl + "/EK.framework.js.unityweb",
      codeUrl: buildUrl + "/EK.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Skybull",
      productName: "EK",
      productVersion: "0.1.0",
    };

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    if (isMobile) {
      // Mobile device style: fill the whole browser client area with the game canvas:

      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas1.className = "unity-mobile";

    } else {
      // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
      //canvas.style.width = "360px";
      //canvas.style.height = "640px";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    const loadingContainer = document.getElementById("unity-loading-background");
    const progressFull = document.getElementById("unity-progress-bar-full");
    const progressEmpty = document.getElementById("unity-progress-bar-empty");
    window.DisableLoading = function() {
      loadingContainer.style.display = "none";
    }


    const loadingTips = [
      "The first data load may take some time,\n so please be patient.",
      "At the Black Market, you can buy anything\n you want—as long as you have the money.",
      "The more land you capture, the stronger\n your kingdom’s economy becomes.",
      "Remember to have children to continue\n your family’s legacy.",
      "Characters with higher stats will generate\n more national attributes for you.",
      "Don’t forget to upgrade skills to make\n your characters even stronger."
    ];

    const loadingTipElement = document.getElementById("unity-loading-text");
    let tipIndex = 0;

    // hiển thị câu đầu tiên
    loadingTipElement.textContent = loadingTips[tipIndex];

    const TIP_INTERVAL = 5000;

    // đổi tip theo chu kỳ
    const tipTimer = setInterval(() => {
      tipIndex = (tipIndex + 1) % loadingTips.length;
      loadingTipElement.textContent = loadingTips[tipIndex];
    }, TIP_INTERVAL);


    var script = document.createElement("script");
    var unityInstanceGlobal;


    function startUnityGame() {
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas1, config, (progress) => {
          const mask = document.getElementById("unity-progress-bar-mask");
          mask.style.width = (progress * 100) + "%";
        }).then((unityInstance) => {
          unityInstanceGlobal = unityInstance;
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    }

    function showWarningAndStart(message) {
      const popup = document.getElementById("warning-popup");
      const textEl = document.getElementById("warning-text");
      const btn = document.getElementById("warning-confirm");

      textEl.textContent = message;
      popup.style.display = "flex";

      btn.onclick = function () {
        popup.style.display = "none";
        startUnityGame();
      };
    }

    // 🔥 Chỉ warning trên mobile
    if (isMobile) {
      showWarningAndStart( "⚠️ The game may crash if you use an iOS device below Iphone 13 promax. " +
              "\nPlease play on a higher device or PC for a better experience.");
    } else {
      // desktop hoặc không có message → load thẳng
      startUnityGame();
    }
    function sendLog(log) {
      if (!unityInstanceGlobal) return;   // 🔥 Unity chưa sẵn sàng → bỏ qua
      unityInstanceGlobal.SendMessage('Web3Manager', 'OnSendLog', log);
    }


  </script>


  <script>
    window.tonConnect = new TON_CONNECT_UI.TonConnectUI({
      //stagging
      manifestUrl: "https://seahorse-magnetic-officially.ngrok.app/api/ftp/File/get-file/eternal_king_mainnet.json",
      //produce
      //manifestUrl: "https://ftpserver.thedungeondiver.com/api/ftp/File/get-file/eternal_king_mainnet.json",
      testnet: false
    });

    async function testJavaScriptFunction(recipientAddress, amount) {
      console.error("Unity says: " + recipientAddress + "_____" + amount);

      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 300, // 5 minutes validity
        messages:
                [
                  {
                    address: recipientAddress, // recipient
                    amount: amount, // 50000000 = 0.05 TON in nanoTON
                    payload: undefined, // optional, use .toBoc().toString('base64') if needed
                  }
                ]
      };

      try {
        const result = await window.tonConnect.sendTransaction(transaction);
        console.log("✅ Transaction sent!");
        console.log("📦 Result:", result);
      }
      catch (err) {
        console.error("❌ Transaction rejected or failed:", err);
      }
    }
  </script>
